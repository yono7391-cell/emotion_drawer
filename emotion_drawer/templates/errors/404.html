{% extends "base.html" %}

{% block title %}찾을 수 없어요 — 감정서랍{% endblock %}

{% block content %}
<section class="section page">
  <div class="container container--narrow">
    <h1 class="page__title">{{ message or "페이지를 찾을 수 없어요." }}</h1>
    <p class="page__back">
      {% if current_user %}
      <a href="{{ url_for('drawer.index') }}">{{ C.DRAWER.back }}</a>
      {% else %}
      <a href="{{ url_for('pages.landing') }}">처음 화면으로</a>
      {% endif %}
    </p>
  </div>
</section>
{% endblock %}
